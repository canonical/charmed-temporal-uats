name: UAT tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      server-track:
        description: 'Server-side charm channel track'
        required: false
        default: '1.31'
        type: choice
        options:
          - '1.31'
      worker-track:
        description: 'Worker charm channel track'
        required: false
        default: '2.0'
        type: choice
        options:
          - '2.0'
      risk:
        description: 'Charm channel risk to test against'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
  workflow_call:
    inputs:
      juju-channel:
        description: Juju snap channel the test controllers are bootstrapped from.
        required: false
        type: string
        default: "3.6/stable"
      postgres-channel:
        description: postgresql-k8s channel deployed by the UAT environment.
        required: false
        type: string
        default: "14/stable"
      postgres-force:
        description: Deploy postgresql-k8s with --force to skip the base support check.
        required: false
        type: boolean
        default: false

# Effective configuration for the run. The inputs context is only populated
# for workflow_call / workflow_dispatch runs; on pull_request it is empty, so
# each input is resolved here with a fallback matching its declared default.
env:
  JUJU_CHANNEL: ${{ inputs.juju-channel || '3.6/stable' }}
  POSTGRESQL_CHANNEL: ${{ inputs.postgres-channel || '14/stable' }}
  POSTGRESQL_FORCE: ${{ inputs.postgres-force || false }}

jobs:
  uats:
    name: Run UATs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        uat:
          - uats-namespace-isolation
          - uats-ingress
          - uats-cos
      fail-fast: false
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.uat }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Maximize GH runner disk
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up operator environment
        run: |
          set -e

          GOSS_VERSION="v0.4.10"
          curl -fSL \
            "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/goss_${GOSS_VERSION#v}_linux_x86_64.tar.gz" \
            -o /tmp/goss.tar.gz

          sudo tar -xzf /tmp/goss.tar.gz -C /usr/local/bin goss
          sudo chmod +x /usr/local/bin/goss
          /usr/local/bin/goss --version

          sudo apt-get purge $(dpkg -l | grep -i docker | awk '{print $2}')
          sudo apt-get purge containerd.io
          sudo rm -r /run/containerd

          sudo snap install concierge --classic
          sudo -E concierge prepare -c .github/workflows/custom-concierge.yaml --juju-channel "$JUJU_CHANNEL"
          sudo k8s enable ingress
          sudo k8s kubectl config view --raw > ~/.kube/config
          uv tool install tox
          just install-nginx-controller

      - name: Install docker (after k8s bootstrapped)
        run: |
          sudo snap install docker
          sudo snap start docker

      - name: Deploy Temporal models
        run: >-
          just deploy-temporal
          ${{ inputs.server-track || '1.31' }}
          ${{ inputs.worker-track || '2.0' }}
          ${{ inputs.risk || 'edge' }}
          "${{ env.POSTGRESQL_CHANNEL }}"
          "${{ env.POSTGRESQL_FORCE }}"

      - name: Execute UATs
        run: just ${{ matrix.uat }}

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state
