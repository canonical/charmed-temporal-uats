command:
  'postgres active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-server-uats-$(just get-model-suffix)" postgresql-k8s
  'temporal server active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-server-uats-$(just get-model-suffix)" temporal-k8s
  'temporal ui active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-server-uats-$(just get-model-suffix)" temporal-ui-k8s
  'temporal admin active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-server-uats-$(just get-model-suffix)" temporal-admin-k8s
  'temporal python worker active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-workers-uats-$(just get-model-suffix)" temporal-worker-k8s-python
  'temporal go worker active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-workers-uats-$(just get-model-suffix)" temporal-worker-k8s-go
  'temporal ui nginx ingress active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-server-uats-$(just get-model-suffix)" temporal-ui-ingress
  'self signed certificates active':
    exit-status: 0
    exec: ./scripts/wait-for-juju-app "temporal-server-uats-$(just get-model-suffix)" self-signed-certificates
